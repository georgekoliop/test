<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Iframe Thank You Page</title>
<script>
  try {
    (function(p, l, o, w, i, n, g) {
      if (!p[i]) {
        p.GlobalSnowplowNamespace = p.GlobalSnowplowNamespace || [];
        p.GlobalSnowplowNamespace.push(i);
        p[i] = function() {
          (p[i].q = p[i].q || []).push(arguments);
        };
        p[i].q = p[i].q || [];
        n = l.createElement(o);
        g = l.getElementsByTagName(o)[0];
        n.async = 1;
        n.src = w;
        g.parentNode.insertBefore(n, g);
      }
    })(window, document, "script", "https://cdn.jsdelivr.net/npm/@snowplow/javascript-tracker@4.5.0/dist/sp.min.js", "snowplow");

    window.snowplow('newTracker', 'cf', 'acme-prod1.mini.snplow.net', {
      appId: 'sandbox-test',
      platform: 'web',
      cookieDomain: null,
      withCredentials: false,
      anonymousTracking: {
        withSessionTracking: true
      },
      contexts: {
        webPage: true
      }
    });

    window.snowplow('trackPageView');
  } catch (e) {
    console.warn('Snowplow tracking failed in sandboxed iframe:', e);
  }
</script>
</head>
<body>
  <h2>Thank You Page (Sandboxed Iframe)</h2>
</body>
</html>
